name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Build and Validate
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install infra dependencies
        run: npm ci --prefix infra

      - name: Check formatting
        id: formatting
        run: |
          echo "Installing Prettier..."
          npx prettier --check "src/**/*.{js,jsx,ts,tsx}" || (echo "::error::Prettier check failed. Run 'npm run format' to fix formatting issues." && exit 1)

      - name: Lint
        id: linting
        run: npm run lint

      - name: Type check
        id: typecheck
        run: npm run type-check

      - name: Unit tests
        id: tests
        run: npm test

      - name: Infra type check
        id: infra-build
        run: npm run build
        working-directory: infra

      - name: Infra tests
        id: infra-tests
        run: npm test
        working-directory: infra

      - name: Infra synth
        id: infra-synth
        run: npx cdk synth
        working-directory: infra

      - name: Build
        id: build
        env:
          # Pull requests are never deployed, and the browser checks answer proxy requests
          # themselves, so a placeholder serves when secrets are unavailable (Dependabot, forks).
          DISCOGS_PROXY_URL: ${{ secrets.DISCOGS_PROXY_URL || 'https://discogs-proxy.invalid/' }}
        run: |
          echo "NEXT_PUBLIC_BASE_PATH=/album-wall" >> .env.local
          echo "NEXT_PUBLIC_DISCOGS_PROXY_URL=$DISCOGS_PROXY_URL" >> .env.local
          npm run build:static

      - name: Check the static output
        id: static-output
        run: npm run check:static-output

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility checks
        id: accessibility
        run: npm run test:a11y
        env:
          NEXT_PUBLIC_BASE_PATH: /album-wall

      - name: Lighthouse checks
        id: lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          NEXT_PUBLIC_BASE_PATH: /album-wall

      - name: PR Status Check
        if: always()
        run: |
          if [ "${{ steps.formatting.outcome }}" == "failure" ] || \
             [ "${{ steps.linting.outcome }}" == "failure" ] || \
             [ "${{ steps.typecheck.outcome }}" == "failure" ] || \
             [ "${{ steps.infra-build.outcome }}" == "failure" ] || \
             [ "${{ steps.infra-tests.outcome }}" == "failure" ] || \
             [ "${{ steps.infra-synth.outcome }}" == "failure" ] || \
             [ "${{ steps.build.outcome }}" == "failure" ] || \
             [ "${{ steps.static-output.outcome }}" == "failure" ] || \
             [ "${{ steps.accessibility.outcome }}" == "failure" ] || \
             [ "${{ steps.lighthouse.outcome }}" == "failure" ]; then
            echo "::error::One or more validation steps failed. Please fix the issues before merging."
            exit 1
          else
            echo "::notice::All validation checks passed!"
          fi
