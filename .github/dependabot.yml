version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-config-next pulls in eslint-plugin-react, which does not work with ESLint 10 yet.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/infra"
    schedule:
      interval: "weekly"
    ignore:
      # ts-jest does not support TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      infra-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
